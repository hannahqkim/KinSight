<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unknown caller prompt</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFF07C}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 32px; background: #1C5253; color: #FFFFFF; font-family: 'Inter Tight', system-ui, sans-serif; display: flex; flex-direction: column; gap: 20px">
  <div style="border-radius: 22px; background: #FFFFFF; color: #1C5253; padding: 18px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">KinSight · now</div>
    <div style="font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2">Unknown number calling</div>
    <div style="font-size: 17px; font-weight: 500; line-height: 1.35">Tap here before you answer. I'll listen with you.</div>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center">
    <div style="width: 120px; height: 120px; border-radius: 999px; background: #79ADDC; display: flex; align-items: center; justify-content: center">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4 H9 L11 9 L8.5 10.5 C9.5 12.5 11.5 14.5 13.5 15.5 L15 13 L20 15 V19 C20 20 19 21 18 21 C10 20.5 3.5 14 3 6 C3 5 4 4 5 4 Z"></path></svg>
    </div>
    <div style="font-weight: 900; font-size: 38px; line-height: 1; letter-spacing: -0.045em">(555) 014-2290</div>
    <div style="font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">Not in your contacts</div>
  </div>
  <div style="border-radius: 18px; border: 2px solid #79ADDC; padding: 16px; font-size: 18px; font-weight: 500; line-height: 1.4">Answer on speaker so KinSight can hear the caller too.</div>
  <button style="height: 72px; border-radius: 20px; border: none; background: #FFF07C; color: #1C5253; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; font-family: inherit">Answer with KinSight</button>
  <a href="#" style="text-align: center; font-size: 17px; font-weight: 700; padding: 10px">Ignore this call</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

</html>
