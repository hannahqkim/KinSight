<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Listening to the caller</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C5253}a:hover{color:#1C5253}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 32px; background: #FFFFFF; color: #1C5253; font-family: 'Inter Tight', system-ui, sans-serif; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="display: flex; gap: 3px; align-items: center; height: 32px; width: 72px" aria-hidden="true">
      <sc-for list="{{wave}}" as="bar" hint-placeholder-count="12">
        <div style="width: 3px; height: {{bar.h}}px; border-radius: 2px; background: #79ADDC; transition: height 140ms"></div>
      </sc-for>
    </div>
    <div style="font-size: 14px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">Listening with you</div>
  </div>

  <div role="meter" aria-label="Scam risk" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" aria-valuetext="{{label}}" style="border-radius: 22px; background: #1C5253; color: #FFFFFF; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">Scam risk, live</div>
      <div style="font-weight: 900; font-size: 34px; line-height: 1; letter-spacing: -0.045em; color: {{labelColor}}; transition: color 300ms">{{label}}</div>
      <div style="font-size: 17px; font-weight: 500">{{sub}}</div>
    </div>
    <div style="display: flex; gap: 4px; align-items: flex-end; height: 64px" aria-hidden="true">
      <sc-for list="{{ticks}}" as="tick" hint-placeholder-count="24">
        <div style="width: 9px; height: {{tick.h}}px; border-radius: 3px; background: {{tick.bg}}; opacity: {{tick.op}}; transition: background 120ms, opacity 120ms"></div>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase" aria-hidden="true">
      <div>Normal</div>
      <div style="text-align: center">Ask first</div>
      <div style="text-align: right">Scam</div>
    </div>
  </div>

  <div style="border-radius: 18px; border: 2px solid #1C5253; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; min-height: 132px; box-sizing: border-box">
    <div style="font-size: 13px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase">The caller is saying</div>
    <p style="margin: 0; font-size: 16px; line-height: 1.4; color: #79ADDC; font-weight: 500">{{prev}}</p>
    <p style="margin: 0; font-size: 21px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em">{{line}}</p>
    <sc-if value="{{hasCue}}" hint-placeholder-val="{{ true }}">
      <div style="align-self: flex-start; border-radius: 999px; background: #FFF07C; color: #1C5253; padding: 5px 12px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase">Heard: {{cue}}</div>
    </sc-if>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{checks}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; border-radius: 14px; border: 2px solid {{c.border}}; padding: 10px 14px; font-size: 16px; font-weight: 500">
        <div style="width: 14px; height: 14px; border-radius: 999px; background: {{c.dot}}; flex-shrink: 0"></div>
        <div style="flex-grow: 1"><b>{{c.title}}</b> · {{c.text}}</div>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>
  <button style="height: 64px; border-radius: 18px; border: 2px solid #1C5253; background: #FFFFFF; color: #1C5253; font-size: 19px; font-weight: 700; font-family: inherit">Call my family instead</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  lines() {
    return [
      { text: '"Hi Grandma, it\'s me."', risk: 0.14, cue: '' },
      { text: '"Can you hear me? I\'m in a bit of trouble."', risk: 0.3, cue: 'trouble story' },
      { text: '"I crashed the car. I\'m at the police station."', risk: 0.46, cue: 'emergency' },
      { text: '"I need $2,000 for bail, today."', risk: 0.72, cue: 'asks for money' },
      { text: '"Please don\'t tell Mom, okay?"', risk: 0.86, cue: 'wants secrecy' },
      { text: '"Can you buy gift cards at the store?"', risk: 0.96, cue: 'gift cards' }
    ];
  }
  componentDidMount() {
    const n = this.lines().length;
    this.lineTimer = setInterval(() => {
      this.setState((s) => ({ step: ((s.step || 0) + 1) % (n + 2) }));
    }, 2600);
    this.wobbleTimer = setInterval(() => {
      this.setState((s) => {
        const L = this.lines();
        const idx = Math.min(s.step || 0, L.length - 1);
        const cur = s.level == null ? 0.08 : s.level;
        const next = cur + (L[idx].risk - cur) * 0.22 + (Math.random() - 0.5) * 0.09;
        return { level: Math.max(0.03, Math.min(0.99, next)), t: (s.t || 0) + 1 };
      });
    }, 150);
  }
  componentWillUnmount() {
    clearInterval(this.lineTimer);
    clearInterval(this.wobbleTimer);
  }
  renderVals() {
    const L = this.lines();
    const s = this.state || {};
    const idx = Math.min(s.step || 0, L.length - 1);
    const level = s.level == null ? 0.08 : s.level;
    const lit = Math.round(level * 24);
    const ticks = Array.from({ length: 24 }, (_, i) => ({
      h: 16 + i * 2,
      bg: i < lit ? (i < 8 ? '#81B29A' : i < 16 ? '#FFF07C' : '#E07A5F') : '#FFFFFF',
      op: i < lit ? 1 : 0.15
    }));
    const t = s.t || 0;
    const wave = Array.from({ length: 12 }, (_, i) => ({
      h: Math.round(6 + Math.abs(Math.sin(t * 0.7 + i * 1.3)) * (10 + level * 16) + Math.random() * 4)
    }));
    let label = 'Sounds normal.', sub = 'Keep listening. Say nothing yet.', labelColor = '#81B29A';
    if (level >= 0.66) { label = 'Likely a scam.'; sub = 'Don\'t send money or share codes.'; labelColor = '#E07A5F'; }
    else if (level >= 0.34) { label = 'Something\'s off.'; sub = 'Get ready to ask a question.'; labelColor = '#FFF07C'; }
    const storyHot = idx >= 3;
    const checks = [
      storyHot
        ? { title: 'The story', text: 'money, rush, secrecy', border: '#E07A5F', dot: '#E07A5F' }
        : { title: 'The story', text: 'listening…', border: '#79ADDC', dot: '#79ADDC' },
      storyHot
        ? { title: 'Who they are', text: 'ask the safe word next', border: '#FFF07C', dot: '#FFF07C' }
        : { title: 'Who they are', text: 'waiting', border: '#79ADDC', dot: '#79ADDC' },
      { title: 'Call back', text: 'on a number you trust', border: '#79ADDC', dot: '#79ADDC' }
    ];
    return {
      ticks, wave, label, sub, labelColor,
      pct: Math.round(level * 100),
      line: L[idx].text,
      prev: idx > 0 ? L[idx - 1].text : ' ',
      cue: L[idx].cue,
      hasCue: !!L[idx].cue,
      checks
    };
  }
}
</script>
</body>
</html>
